# Codemagic CI — builds Lull (Vite + React + Capacitor 6) and uploads to App Store Connect.
# Runs entirely in the cloud; no Mac required.
#
# One-time setup in the Codemagic UI before the first run:
#   1. Add this GitHub repo as an app.
#   2. Settings -> Integrations -> Developer Portal: add your App Store Connect API key
#      ("App Manager" access). Integration name must match `app_store_connect` below.
#   3. Add a SECURE env var CERTIFICATE_PRIVATE_KEY (a PEM RSA private key) in group "appstore".
#
workflows:
  ios-release:
    name: Lull iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Auto-start this workflow when commits land on main (e.g. a merged release PR),
    # so a git push builds + uploads to App Store Connect without opening the UI.
    # Requires Codemagic's GitHub webhook (added when the app is connected) and
    # "Automatic build triggering" enabled for the app. To build only tagged
    # releases instead, swap branch_patterns for: tag_patterns: [{pattern: 'v*', include: true}].
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    integrations:
      app_store_connect: "Codemagic Lull"   # must match your Codemagic integration name

    environment:
      groups:
        - appstore                          # holds CERTIFICATE_PRIVATE_KEY (secure)
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        APP_APPLE_ID: "6783862542"          # Lull's numeric Apple ID in App Store Connect
        BUNDLE_ID: "com.tinybirdbigdreams.lull"

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Build the web app (Vite)
        script: |
          npm run build

      - name: Add iOS platform (if not committed) and sync
        script: |
          [ -d "ios/App" ] || npx cap add ios
          # Raise the iOS deployment target 13 -> 15. App Store Connect warns (ITMS-90068)
          # on <15 and will REQUIRE >=15 from Spring 2027. MinimumOSVersion in the built
          # Info.plist derives from IPHONEOS_DEPLOYMENT_TARGET, so set it in the Xcode project;
          # also bump the Podfile platform so pods build for 15. Do this BEFORE `cap sync`
          # (which runs pod install). BSD sed (macOS) needs the empty '' after -i.
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9][0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" \
            ios/App/App.xcodeproj/project.pbxproj || true
          [ -f ios/App/Podfile ] && sed -i '' "s/platform :ios, '[0-9.][0-9.]*'/platform :ios, '15.0'/g" ios/App/Podfile || true
          npx cap sync ios

      - name: Generate app icon + splash from assets/
        script: |
          if [ -f assets/icon.png ]; then
            npx --yes @capacitor/assets@3 generate --ios
          else
            echo "no assets/icon.png — skipping asset generation"
          fi

      - name: Configure Info.plist (encryption, portrait, full-screen)
        script: |
          PLIST="ios/App/App/Info.plist"
          # no non-exempt encryption -> skips the App Store export-compliance prompt
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption NO" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool NO" "$PLIST"
          # lock iPhone to portrait
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          # lock iPad to portrait
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" "$PLIST"
          # always full-screen on iPad (no Split View / Slide Over resizing)
          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen YES" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool YES" "$PLIST"
          # Marketing version (CFBundleShortVersionString), sourced from package.json.
          # App Store Connect rejects any upload whose version is not HIGHER than the last
          # approved version, so bump "version" in package.json for each release
          # (currently 2.0.0, which is > the approved 1.0). The build number is handled
          # separately (next step, auto-incremented from App Store Connect).
          APP_VERSION=$(node -p "require('./package.json').version")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" "$PLIST"
          echo "Set CFBundleShortVersionString to $APP_VERSION"

      - name: Set build number (auto-increment from App Store Connect)
        script: |
          LATEST=$(app-store-connect get-latest-build-number "$APP_APPLE_ID" 2>/dev/null || echo "0")
          [ -z "$LATEST" ] && LATEST=0
          NEW=$((LATEST + 1))
          echo "Setting build number to $NEW"
          cd ios/App
          agvtool new-version -all "$NEW"

      - name: Sign and build the signed IPA
        script: |
          set -e
          # Pin the app target's bundle id to match the App ID + profile
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" \
            ios/App/App.xcodeproj/project.pbxproj || true
          # Create (or reuse) the distribution cert from OUR persistent private key, + the profile
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          # Apply the profile AND archive in the same step so signing state is fresh.
          # TARGETED_DEVICE_FAMILY=1,2 -> universal (iPhone + iPad).
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" \
            --archive-flags "TARGETED_DEVICE_FAMILY=1,2"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # set true later if you want TestFlight
        submit_to_app_store: false    # we attach + submit manually in App Store Connect